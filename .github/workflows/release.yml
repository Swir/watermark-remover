name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v1.0.0)
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $version = "${{ inputs.version }}" }
          elseif ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}" }
          else { $version = "v1.0.0" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller opencv-python numpy ttkbootstrap Pillow

      - name: Build English EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Watermark-Remover-Pro-ENG" --collect-all ttkbootstrap "watermark Eng.py"

      - name: Build Polish EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Watermark-Remover-Pro-PL" --collect-all ttkbootstrap "watermark remover PL.py"

      - name: Package release
        shell: pwsh
        run: |
          @"
          Use this software only on images you own or have permission to modify.
          "@ | Set-Content "USAGE_NOTICE.txt"
          $zip = "Watermark-Remover-Pro-$env:VERSION-Windows-x64.zip"
          Compress-Archive -Path "dist/Watermark-Remover-Pro-ENG.exe", "dist/Watermark-Remover-Pro-PL.exe", "README.md", "USAGE_NOTICE.txt" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:VERSION --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:VERSION "dist/Watermark-Remover-Pro-ENG.exe" "dist/Watermark-Remover-Pro-PL.exe" "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $env:VERSION "dist/Watermark-Remover-Pro-ENG.exe" "dist/Watermark-Remover-Pro-PL.exe" "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --target "${{ github.sha }}" --title "Watermark Remover Pro $env:VERSION" --generate-notes --repo "${{ github.repository }}"
          }
